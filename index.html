<!doctype html>
<html lang="en" class="i18n-pending">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Beat Deck</title>
    <meta name="description" content="Beat Deck: four rhythm cards on the table, one per beat, looping and changing as you play. Play them on your instrument." />
    <meta name="theme-color" content="#181212" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Crect x=%2218%22 y=%228%22 width=%2264%22 height=%2284%22 rx=%228%22 fill=%22%23e05a7c%22/%3E%3Cellipse cx=%2244%22 cy=%2268%22 rx=%2213%22 ry=%229%22 fill=%22%231c1414%22 transform=%22rotate(-20 44 68)%22/%3E%3Crect x=%2254%22 y=%2224%22 width=%225%22 height=%2244%22 fill=%22%231c1414%22/%3E%3C/svg%3E" />
    <link rel="preload" href="assets/fonts/caveat-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <!-- Les textes sont posés par js/i18n.js (attributs data-i18n*). -->
    <canvas id="stage"></canvas>

    <header id="hud" hidden>
      <div class="hud-text">
        <strong id="hud-title"></strong>
        <span id="hud-info" class="muted"></span>
      </div>
      <div class="hud-live">
        <span id="hud-tempo" class="stepper">
          <button class="small ghost" data-tempo="-5" data-i18n-aria="hud.slower">−</button>
          <output id="hud-bpm"></output>
          <button class="small ghost" data-tempo="5" data-i18n-aria="hud.faster">+</button>
        </span>
        <span class="stepper">
          <button class="small ghost" data-rand="-1" data-i18n-aria="hud.lessRandom">−</button>
          <output id="hud-rand"></output>
          <button class="small ghost" data-rand="1" data-i18n-aria="hud.moreRandom">+</button>
        </span>
        <span class="stepper">
          <button class="small ghost" data-level-step="-1" data-i18n-aria="hud.easier">−</button>
          <output id="hud-level"></output>
          <button class="small ghost" data-level-step="1" data-i18n-aria="hud.harder">+</button>
        </span>
        <select id="hud-sound" data-i18n-aria="hud.sound"></select>
      </div>
      <div class="hud-actions">
        <button class="chip" data-toggle="guide"></button>
        <button class="chip" data-toggle="metronome"></button>
        <button class="chip" data-toggle="backing"></button>
        <button id="btn-pause" class="small" data-i18n-aria="hud.pause">❚❚</button>
        <button id="btn-stop" class="small ghost"></button>
      </div>
    </header>

    <section id="menu" class="screen">
      <button id="btn-lang" class="ghost small lang-switch"></button>
      <h1 class="logo">Beat Deck</h1>
      <p class="tagline" data-i18n="menu.tagline"></p>
      <button id="btn-play" class="play" data-i18n="menu.play"></button>
      <div class="row">
        <button id="btn-guide" class="ghost" data-i18n="menu.guide"></button>
        <button id="btn-settings" class="ghost" data-i18n="menu.settings"></button>
        <button id="btn-howto" class="ghost" data-i18n="menu.howto"></button>
      </div>
      <p id="menu-stats" class="muted"></p>
    </section>

    <section id="setup" class="screen modal">
      <div class="panel" role="dialog" aria-modal="true" aria-labelledby="setup-title">
        <h2 id="setup-title" data-i18n="setup.title"></h2>
        <p class="muted center" data-i18n="setup.intro"></p>
        <form id="setup-form" onsubmit="return false">
          <label><span data-i18n="setup.level"></span> <select name="difficulty"></select></label>
          <label><span data-i18n="setup.randomness"></span> <select name="randomness"></select></label>
          <label><span><span id="setup-bpm-label"></span> <output id="setup-bpm"></output> BPM</span>
            <span class="inline">
              <button type="button" class="ghost small" data-bpm-step="-5">−5</button>
              <input type="range" name="bpm" min="40" max="240" step="1" />
              <button type="button" class="ghost small" data-bpm-step="5">+5</button>
            </span>
          </label>
        </form>
        <div class="row">
          <button id="btn-start" data-i18n="setup.start"></button>
          <button class="back ghost" data-i18n="back"></button>
        </div>
      </div>
    </section>

    <section id="settings" class="screen modal">
      <div class="panel" role="dialog" aria-modal="true" aria-labelledby="settings-title">
        <h2 id="settings-title" data-i18n="settings.title"></h2>
        <form id="settings-form" onsubmit="return false">
          <label><span data-i18n="settings.guideSound"></span>
            <span class="inline"><select name="guideSound"></select><button type="button" data-test="guide" class="ghost small" data-i18n="settings.listen"></button></span>
          </label>
          <label><span data-i18n="settings.clickSound"></span>
            <span class="inline"><select name="clickSound"></select><button type="button" data-test="click" class="ghost small" data-i18n="settings.listen"></button></span>
          </label>
          <label class="check"><input type="checkbox" name="guide" /> <span data-i18n="settings.guide"></span></label>
          <label class="check"><input type="checkbox" name="metronome" /> <span data-i18n="settings.metronome"></span></label>
          <label class="check"><input type="checkbox" name="backing" /> <span data-i18n="settings.backing"></span></label>
          <label class="check"><input type="checkbox" name="counting" /> <span data-i18n="settings.counting"></span></label>
          <label><span><span data-i18n="settings.offset"></span> <output data-for="offset"></output></span>
            <input type="range" name="offset" min="-200" max="200" step="5" />
            <small class="muted" data-i18n="settings.offsetHelp"></small>
          </label>
          <label><span><span data-i18n="settings.volume"></span> <output data-for="volume"></output></span><input type="range" name="volume" min="0" max="1" step="0.05" /></label>
        </form>
        <button class="back" data-i18n="back"></button>
      </div>
    </section>

    <section id="guide" class="screen modal">
      <div class="panel wide guide" role="dialog" aria-modal="true" aria-labelledby="guide-title">
        <h2 id="guide-title" data-i18n="menu.guide"></h2>
        <div id="guide-body"></div>
        <button class="back" data-i18n="back"></button>
      </div>
    </section>

    <section id="howto" class="screen modal">
      <div class="panel" role="dialog" aria-modal="true" aria-labelledby="howto-title">
        <h2 id="howto-title" data-i18n="howto.title"></h2>
        <div class="stack" data-i18n-html="howto.body"></div>
        <button class="back" data-i18n="back"></button>
      </div>
    </section>

    <section id="results" class="screen modal">
      <div class="panel" role="dialog" aria-modal="true" aria-labelledby="res-title">
        <h2 id="res-title"></h2>
        <div id="res-body" class="center"></div>
        <div id="res-actions" class="row"></div>
      </div>
    </section>

    <script src="vendor/vexflow-bravura.js"></script>
    <script type="module" src="js/main.js"></script>
  </body>
</html>
